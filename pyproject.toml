[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "agenticsql"
version = "1.0.0"
description = "Chat with your database using natural language. Built with LangChain and Google Gemini."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Rahul"},
]

dependencies = [
    "langchain>=0.3.0,<0.4.0",
    "langchain-community>=0.4.0,<0.5.0",
    "langchain-google-genai>=2.0.0,<3.0.0",
    "SQLAlchemy>=2.0.0,<3.0.0",
    "pyodbc>=5.0.0,<6.0.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "pymysql>=1.1.0,<2.0.0",
    "cryptography>=42.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    "matplotlib>=3.7.0,<4.0.0",
    "pandas>=2.0.0,<3.0.0",
    "sqlglot>=25.0.0",
    "rich>=13.0.0,<14.0.0",
    "prompt-toolkit>=3.0.0,<4.0.0",
    "fastapi>=0.110.0,<1.0.0",
    "uvicorn[standard]>=0.29.0,<1.0.0",
    "websockets>=12.0,<14.0",
    "streamlit>=1.35.0",
    "plotly>=5.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.4.0",
]
eval = [
    "deepeval>=4.0.0",
    "langfuse>=4.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
agenticsql = "agenticsql.cli:main"

[tool.setuptools.packages.find]
include = ["agenticsql*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--ignore=test_sql_agent.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
