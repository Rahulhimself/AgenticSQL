name: AgenticSQL Evaluation Pipeline & Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  evaluate:
    name: Run Benchmark & Quality Gate
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_mock_ci_key' }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || '' }}
      DB_TYPE: sqlite
      DB_NAME: data/test_ci.db
      DB_USER: test_user
      DB_PASSWORD: test_password
      DB_SERVER: 127.0.0.1
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]


    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Base and Evaluation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest deepeval langfuse tabulate

      - name: Run Core Agent Unit Tests
        env:
          LLM_PROVIDER: mock
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'gsk_mock_ci_key' }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY || '' }}
          DB_TYPE: sqlite
          DB_NAME: data/test_ci.db
          DB_USER: test_user
          DB_PASSWORD: test_password
          DB_SERVER: 127.0.0.1
        run: |
          pytest tests/test_agent.py tests/test_guardrails.py tests/test_config.py tests/test_visualization.py tests/test_auth_tenancy.py tests/test_fewshot_profiler.py tests/test_dynamic_switching.py tests/test_ui.py -v

      - name: Run Evaluation Harness Tests
        env:
          LLM_PROVIDER: mock
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          pytest tests/eval/ -v

      - name: Run Full Evaluation Benchmark & Quality Gate Check
        env:
          LLM_PROVIDER: ${{ secrets.GROQ_API_KEY != '' && 'groq' || 'mock' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python -m agenticsql.eval.runner \
            --dataset agenticsql/eval/data/golden_sql_eval.json \
            --dialect sqlite \
            --output-dir logs/eval_results \
            --fail-under 0.85

      - name: Upload Evaluation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-reports-py${{ matrix.python-version }}
          path: logs/eval_results/
          retention-days: 14
